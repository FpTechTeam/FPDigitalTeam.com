<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FP Digital Beats</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles (can reuse styles.css if you want) -->
  <style>
    :root {
      --blue-soft: #5fd7ff;
      --blue-main: #00c8ff;
      --text-main: #ffffff;
      --border-glow: rgba(0,200,255,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body, html { height: 100%; width: 100%; background: #020b1a; color: var(--text-main); }

    /* ===== Navigation ===== */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-glow);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    nav h1 { color: var(--blue-soft); font-size: 1.5rem; }
    .nav-links a {
      margin-left: 30px;
      color: #cdefff;
      text-decoration: none;
      font-weight: 500;
    }
    .nav-links a.active { color: var(--blue-main); border-bottom: 2px solid var(--blue-main); }

    /* ===== Iframe Container ===== */
    .iframe-container {
      position: relative;
      width: 100%;
      height: calc(100vh - 80px); /* full height minus nav */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <h1>FP Digital</h1>
    <div class="nav-links">
      <a href="/index.html">Home</a>
      <a href="/projects.html">Projects</a>
      <a href="/founder.html">Founder</a>
      <a href="/beats.html" class="active">Beats</a>
    </div>
  </nav>

  <!-- Iframe Section -->
  <div class="iframe-container">
    <iframe 
      src="https://player.beatstars.com/?storeId=136232" 
      allow="autoplay; encrypted-media"
      allowfullscreen
    ></iframe>
  </div>

</body>
</html>
